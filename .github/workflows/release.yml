name: Build Release Packages

## Builds unsigned artifacts for each OS when a v* tag is pushed (or on manual dispatch).
#on:
#  push:
#    tags: ["v*"]
#  workflow_dispatch:

on:
  release:
    types:
      - created

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.*
          cache: true

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev

      - uses: seanmiddleditch/gha-setup-ninja@v6

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/PolyScope.app -qmldir=qml
          # macdeployqt invalidates signatures; an unsigned arm64 bundle is reported as "damaged".
          codesign --force --deep -s - build/PolyScope.app
          ditto -c -k --keepParent build/PolyScope.app PolyScope-macOS.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item build/PolyScope.exe stage/
          windeployqt --qmldir qml --release --dir stage stage/PolyScope.exe
          # Inno Setup is preinstalled on windows-latest runners.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $version = "${{ github.ref_name }}".TrimStart('v')
          & $iscc "/DAppVersion=$version" "/DStageDir=$PWD\stage" packaging/windows/PolyScope.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        env:
          # Runners have no FUSE, so the AppImage tools must unpack themselves instead of mounting.
          APPIMAGE_EXTRACT_AND_RUN: 1
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          QML_SOURCES_PATHS: ${{ github.workspace }}/qml
          LINUXDEPLOY_OUTPUT_VERSION: ${{ github.ref_name }}
          OUTPUT: PolyScope-Linux-x86_64.AppImage
        run: |
          cmake --install build --prefix AppDir/usr
          base=https://github.com/linuxdeploy
          curl -fsSL -o linuxdeploy "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -fsSL -o linuxdeploy-plugin-qt "$base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          # The plugin is found by name next to the linuxdeploy binary.
          ./linuxdeploy --appdir AppDir --plugin qt --output appimage \
            --desktop-file packaging/linux/polyscope.desktop \
            --icon-file packaging/linux/icons/256x256/polyscope.png

      - uses: actions/upload-artifact@v7
        with:
          name: PolyScope-${{ runner.os }}
          path: PolyScope-*.*

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: PolyScope-*.*
