name: Build Release Packages

## Builds unsigned artifacts for each OS when a v* tag is pushed (or on manual dispatch).
#on:
#  push:
#    tags: ["v*"]
#  workflow_dispatch:

on:
  release:
    types:
      - created

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.*
          cache: true

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev

      - uses: seanmiddleditch/gha-setup-ninja@v5

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/PolyScope.app -qmldir=qml
          ditto -c -k --keepParent build/PolyScope.app PolyScope-macOS.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item build/PolyScope.exe stage/
          windeployqt --qmldir qml --release --dir stage stage/PolyScope.exe
          Compress-Archive -Path stage/* -DestinationPath PolyScope-Windows.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake --install build --prefix stage/usr
          tar -C stage -czf PolyScope-Linux.tar.gz usr

      - uses: actions/upload-artifact@v7
        with:
          name: PolyScope-${{ runner.os }}
          path: PolyScope-*.*

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PolyScope-*.*
